<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CogniPath Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body dark-mode">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h2>Admin<span style="color: var(--primary);">Panel</span></h2>
        </div>
        <ul class="admin-nav">
            <li data-view="dashboard" class="active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard
            </li>
            <li data-view="users">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                User Management
            </li>
            <li data-view="resources">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                Content & Resources
            </li>
            <li data-view="logs">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                Activity Logs
            </li>
        </ul>
        <div class="sidebar-footer">
            <button id="btnReturnApp" class="btn-ghost">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Return to App
            </button>
        </div>
    </aside>

    <!-- Main Layout -->
    <main class="admin-main">
        <!-- Top Nav -->
        <header class="admin-header">
            <div class="header-search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="globalAdminSearch" placeholder="Search users, topics, or logs...">
            </div>
            <div class="header-actions">
                <div class="admin-profile-menu">
                    <img id="adminAvatar" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&auto=format&fit=crop&q=80" alt="Admin">
                    <span id="adminNameDisplay">Admin</span>
                    <button id="btnAdminLogout" class="btn-danger" style="margin-left:1rem; padding: 0.4rem 0.8rem; font-size:0.8rem;">Logout</button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div class="admin-content" id="adminContentArea">
            <!-- Populated by adminApp.js -->
        </div>
    </main>

    <!-- User Details Modal (Hidden by default) -->
    <div id="userDetailsModal" class="admin-modal hidden">
        <div class="admin-modal-content">
            <div class="modal-header">
                <h3 id="modalUserName">User Profile</h3>
                <button class="close-btn" id="btnCloseModal">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" data-target="tab-overview">Overview</button>
                <button class="tab-btn" data-target="tab-progress">Progress</button>
                <button class="tab-btn" data-target="tab-resources">Resources</button>
                <button class="tab-btn" data-target="tab-logs">Activity Log</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="adminToastContainer" class="toast-container"></div>

    <script src="../js/adminApp.js"></script>
</body>
</html>
